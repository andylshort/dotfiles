## Atuin config: only settings that matter here. Everything else uses the defaults;
## see https://docs.atuin.sh/configuration/config/ for the full list.

## Enter runs the selected command; Tab puts it in the prompt for editing
enter_accept = true

[sync]
## Sync v2
records = true

[tmux]
## Search in a tmux popup when inside tmux (tmux >= 3.2)
enabled = true

[ai]
enabled = false

[dotfiles]
enabled = false
