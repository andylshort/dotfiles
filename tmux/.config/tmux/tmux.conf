# 0. tmux plugin manager
# (Some things you just need an actual plugin for...)
# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-yank'
# Seamless C-h/j/k/l between vim splits and tmux panes (pairs with the vim plugin)
set -g @plugin 'christoomey/vim-tmux-navigator'


# 1. General
set -g default-terminal "tmux-256color"
set-option -sa terminal-features ',xterm-ghostty:RGB,mouse'
set -as terminal-overrides ",xterm*:Tc"
# Undercurl/coloured underlines, and extended keys (e.g. Shift+Enter in Claude Code)
set -as terminal-features ',xterm-ghostty:usstyle:extkeys'
set -s extended-keys on
set -s extended-keys-format csi-u

# Pass focus events through for vim autoread and Claude Code
set -g focus-events on

# Show host/session/window in the terminal's tab title
set -g set-titles on
set -g set-titles-string "#h: #S / #W"

# Allow image escape sequences to pass through tmux to Ghostty
set -g allow-passthrough on

# Update environment variables so Yazi detects Ghostty properly
set -ga update-environment TERM
set -ga update-environment TERM_PROGRAM

# Use current shell
set -g default-command "${SHELL}"

set -g history-limit 1000000

# Faster escape sequences
set -sg escape-time 10

# Start window numbering at 1
set -g base-index 1
setw -g pane-base-index 1

# Renumber windows after closing
set -g renumber-windows on

# Automatically rename windows
set -g automatic-rename on

# Enable standard clipboard integration (allows OSC 52 pass-through)
set -g set-clipboard on

# Reload config
bind r source-file "$HOME/.config/tmux/tmux.conf" \; display-message "tmux config reloaded"

# 2. Prefix
# Prefer C-a for local tmux sessions, and C-b for remote.
# Saves the dance of doing C-b C-b for each command too.
if-shell 'test -n "$SSH_CONNECTION"' {
    set -g prefix C-b
    bind C-b send-prefix
} {
    set -g prefix C-a
    unbind C-b
    bind C-a send-prefix
}

# 3. Mouse
setw -g mouse on
# Fix Ghostty click responsiveness: switch on MouseUp instead of MouseDown
unbind -n MouseDown1Pane
bind-key -n MouseUp1Pane select-pane -t =

unbind -n MouseDown1Status
bind-key -n MouseUp1Status select-window -t =

# 4. Splits
# Easier split keys, open panes in current directory
bind c new-window -c "#{pane_current_path}"
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

unbind '"'
unbind %

# 5. Vim mode
set-window-option -g mode-keys vi

# Vim style pane selection
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Use Alt-vim keys without prefix key to switch panes
bind -n M-h select-pane -L
bind -n M-j select-pane -D
bind -n M-k select-pane -U
bind -n M-l select-pane -R

# 'v' to begin selection
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle

# 'y' to copy selection to system clipboard via small scriptlet
bind-key -T copy-mode-vi y send-keys -X copy-pipe

unbind -T copy-mode-vi MouseDragEnd1Pane

# 6. Appearance
set -g status-justify left
set -g status-position bottom
set -g status-left-length 50
set -g status-right-length 100

# Dracula colour palette (without the headache of the plugin...)
white='#f8f8f2'
gray='#44475a'
dark_gray='#282a36'
light_purple='#bd93f9'
dark_purple='#6272a4'
cyan='#8be9fd'
green='#50fa7b'
orange='#ffb86c'
red='#ff5555'
pink='#ff79c6'

set -g status-style "bg=${dark_gray},fg=${white}"

# Clearly delineate between remote and local tmux instances
setw -g window-status-style "bg=${gray},fg=${white}"
setw -g window-status-current-format " #I:#W "
# Flag windows that rang the bell (e.g. Claude Code finishing or waiting for input)
setw -g window-status-bell-style "bg=${red},fg=${white},bold"

if-shell 'test -n "$SSH_CONNECTION"' {
    # Remote: Cyan/Orange theme with a big red REMOTE warning
    set -g status-left "#[bg=${cyan},fg=${dark_gray},bold] #S #[bg=${dark_gray},fg=${cyan}] "
    setw -g window-status-current-style "bg=${orange},fg=${dark_gray},bold"
    set -g status-right "#[bg=${red},fg=${white},bold] REMOTE #[bg=${gray},fg=${white}] %Y-%m-%d #[bg=${dark_purple},fg=${white}] %H:%M "
} {
    # Local: standard Purple/Pink theme with a green LOCAL badge
    set -g status-left "#[bg=${light_purple},fg=${dark_gray},bold] #S #[bg=${dark_gray},fg=${light_purple}] "
    setw -g window-status-current-style "bg=${pink},fg=${dark_gray},bold"
    set -g status-right "#[bg=${green},fg=${dark_gray},bold] LOCAL #[bg=${gray},fg=${white}] %Y-%m-%d #[bg=${dark_purple},fg=${white}] %H:%M "
}

# 7. Misc Keybindings
# Smart pane resizing
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Kill session(s), picking with fzf if there are several
bind X display-popup -E -w 80% -h 60% "tmux-kill"


if-shell "test -e ~/.tmux.conf.work" {
    source-file "~/.tmux.conf.work"
}
if-shell "test -e ~/.tmux.conf.personal" {
    source-file "~/.tmux.conf.personal"
}

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.config/tmux/plugins/tpm/tpm'
