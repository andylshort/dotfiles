# 1. General
set -g default-terminal "tmux-256color"
# tmux 3.8+ defaults to its own built-in colour theme; use the terminal's palette (Ghostty's theme) instead
set -gq theme terminal
# True colour, undercurl/coloured underlines, and extended keys (e.g. Shift+Enter in Claude Code)
set -as terminal-features ',xterm-ghostty:RGB:mouse:usstyle:extkeys,xterm-256color:RGB'
# Pass OSC 8 hyperlinks (e.g. links in Claude Code output) through to the terminal
set -as terminal-features ',*:hyperlinks'
set -s extended-keys on
set -sq extended-keys-format csi-u

# Pass focus events through for vim autoread and Claude Code
set -g focus-events on

# Show host/session/window in the terminal's tab title
set -g set-titles on
set -g set-titles-string "#h: #S / #W"

# Allow image escape sequences to pass through tmux to Ghostty
set -g allow-passthrough on

# Update TERM_PROGRAM on attach so Yazi detects Ghostty properly
set -ga update-environment TERM_PROGRAM

# Use current shell
set -g default-command "${SHELL}"

set -g history-limit 1000000

# Faster escape sequences
set -sg escape-time 10

# Start window numbering at 1
set -g base-index 1
setw -g pane-base-index 1

# Renumber windows after closing
set -g renumber-windows on

# Automatically rename windows
set -g automatic-rename on

# Copy to the system clipboard over OSC 52, from tmux's copy mode and from programs
# inside it (e.g. Vim/Neovim yanks), locally and over SSH alike
set -g set-clipboard on

# Reload config (prefix + C-r: r is refresh-client, and work/dev binds R)
bind C-r source-file "$HOME/.config/tmux/tmux.conf" \; display-message "tmux config reloaded"

# 2. Prefix
# C-Space everywhere: no shell, Vim or Claude Code binding needs it (C-a and C-b do).
# Nested (local tmux + remote tmux), press it twice to reach the inner tmux; the status
# bar of whichever tmux is waiting for a command lights up (see Appearance)
set -g prefix C-Space
unbind C-b
bind C-Space send-prefix

# 3. Mouse
setw -g mouse on
# Fix Ghostty click responsiveness: switch on MouseUp instead of MouseDown
unbind -n MouseDown1Pane
bind-key -n MouseUp1Pane select-pane -t =

unbind -n MouseDown1Status
bind-key -n MouseUp1Status select-window -t =

# 4. Splits
# Easier split keys, open panes in current directory
bind c new-window -c "#{pane_current_path}"
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

unbind '"'
unbind %

# 5. Vim mode
set-window-option -g mode-keys vi

# Alt-h/j/k/l move between panes, and between (Neo)Vim splits when the pane is running
# one (Neovim uses vim-tmux-navigator; ~/.vimrc has the equivalent built in). Alt rather
# than Ctrl, as the shell and Claude Code need Ctrl-h/j/k/l (Ctrl-l clears, Ctrl-k kills
# to end of line); Alt-h and Alt-l (zsh's run-help and down-case-word) are all this costs.
# In a nested tmux the outer one takes these: use prefix prefix + arrow keys (tmux's
# defaults) to move between the inner one's panes
is_vim="ps -o state= -o comm= -t '#{pane_tty}' | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?\\.?(view|l?n?vim?x?)(diff)?(-wrapped)?$'"
bind -n M-h if-shell "$is_vim" 'send-keys M-h' 'select-pane -L'
bind -n M-j if-shell "$is_vim" 'send-keys M-j' 'select-pane -D'
bind -n M-k if-shell "$is_vim" 'send-keys M-k' 'select-pane -U'
bind -n M-l if-shell "$is_vim" 'send-keys M-l' 'select-pane -R'
bind -T copy-mode-vi M-h select-pane -L
bind -T copy-mode-vi M-j select-pane -D
bind -T copy-mode-vi M-k select-pane -U
bind -T copy-mode-vi M-l select-pane -R

# 'v' to begin selection, 'y' (or a mouse drag) copies and leaves copy mode
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel

# 6. Appearance
# A solid-coloured bar, so it never blends into the shell background: it's obvious at a
# glance whether you're in tmux, and nested sessions can't be confused:
# - Local:  mauve bar
# - Remote: peach bar, led by the hostname (nested, it sits just above the local one)
# - Waiting for a command after the prefix: that tmux's bar turns light, so with nested
#   sessions you can see which one the next key goes to
# Catppuccin Macchiato, matching Ghostty's theme
dark='#24273a'   # base
light='#cad3f5'  # text
red='#ed8796'    # red
%if "#{!=:$SSH_CONNECTION,}"
accent='#f5a97f'  # peach
set -g status-left "#[bold] #h #[nobold]#S "
%else
accent='#c6a0f6'  # mauve
set -g status-left "#[bold] #S "
%endif
set -g status-position bottom
set -g status-style "#{?client_prefix,bg=${light},bg=${accent}},fg=${dark}"
set -g status-left-length 50
set -g status-right " %a %d %b  %H:%M "
setw -g window-status-format " #I:#W#F "
setw -g window-status-current-format " #I:#W "
setw -g window-status-current-style "bg=${dark},fg=${accent},bold"
# Flag windows that rang the bell (e.g. Claude Code finishing or waiting for input)
setw -g window-status-bell-style "bg=${red},fg=${light},bold"
set -g pane-active-border-style "fg=${accent}"
set -g message-style "bg=${dark},fg=${accent},bold"
# Popups (e.g. atuin's Ctrl-R) on the terminal's own background, like a normal pane
set -g popup-style "bg=default,fg=default"
set -g popup-border-style "fg=${accent}"

# 7. Misc Keybindings
# Resizing is tmux's default: prefix + Alt-arrows (5 cells) or Ctrl-arrows (1), repeatable

# Sessions: prefix+s lists them (x kills the highlighted one; t tags several, X kills them)


if-shell "test -e ~/.tmux.conf.work" {
    source-file "~/.tmux.conf.work"
}
if-shell "test -e ~/.tmux.conf.personal" {
    source-file "~/.tmux.conf.personal"
}
