# Get editor completions based on the config schema
"$schema" = 'https://starship.rs/config-schema.json'

# Inserts a blank line between shell prompts
add_newline = true

command_timeout = 100

[directory]
truncation_length = 8

[character]
success_symbol = "[\\$](bold green)"
error_symbol = "[\\$](bold red)"


# Unused modules
[aws]
disabled = true

[gcloud]
disabled = true

[azure]
disabled = true

[kubernetes]
disabled = true

# Only show Lua in actual Lua/Neovim projects, not for any stray .lua file
[lua]
detect_extensions = ["rockspec"]
detect_files = [".lua-version", "init.lua", ".luarc.json", ".luarc.jsonc", "stylua.toml", ".stylua.toml"]
detect_folders = ["lua"]
